<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Task → Graph 演示</title><link rel="stylesheet" href="/style.css"></head><body><header><h1>Task → Graph</h1><span>多轮澄清 · 明确确认 · DAG 产物</span></header><main><section><h2>对话</h2><div id="history"></div><form id="chat"><textarea id="message" placeholder="描述任务，可以一次补充多个要求" required></textarea><button id="send">发送</button><button type="button" id="new">新会话</button></form><p id="status"></p><button id="confirm" disabled>确认当前草稿并生成 DAG</button></section><section><h2>产物</h2><button id="download" disabled>下载产物 JSON</button><div id="dag"></div><h3>任务草稿与检查结果</h3><pre id="artifacts">尚无产物</pre></section></main><script src="/app.js"></script></body></html>
